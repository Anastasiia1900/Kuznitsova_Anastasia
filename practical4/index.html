<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.scss">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1 id="timer">0</h1>
        <input type="number" id="secondsInput" placeholder="Введи секунди">
        <div class="buttons">
            <button class="start" onclick="startTimer()">Старт</button>
            <button class="pause" onclick="pauseTimer()">Пауза</button>
            <button class="add" onclick="addTime()">+10 сек</button>
            <button class="minus" onclick="minusTime()">-10 сек</button>
        </div>
        <p id="message"></p>
    </div>   
</body>
</html>
